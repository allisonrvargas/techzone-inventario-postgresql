name: CI (valida que los scripts SQL se ejecuten)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: techzone
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: techzone
    steps:
      - uses: actions/checkout@v4
      - name: Crear tablas, insertar datos y crear el procedimiento
        run: |
          psql -v ON_ERROR_STOP=1 -f db.sql
          psql -v ON_ERROR_STOP=1 -f insert.sql
          psql -v ON_ERROR_STOP=1 -f procedure.sql
      - name: Ejecutar las consultas
        run: psql -v ON_ERROR_STOP=1 -f queries.sql
      - name: Verificar datos, procedimiento y restricciones
        run: psql -v ON_ERROR_STOP=1 -f tests/verificar.sql